# Балансировщик перед экземплярами гейтвея (§3.3.8.1).
#
# Главная настройка здесь — отключение буферизации. Без неё nginx
# копит ответ и отдаёт целиком, превращая TTFT в полное время генерации.
# Ошибка обнаруживается уже на демо, когда стрим «не идёт».

worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;

    upstream gateway {
        least_conn;
        server gateway-1:8080 max_fails=3 fail_timeout=5s;
        server gateway-2:8080 max_fails=3 fail_timeout=5s;
        keepalive 256;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Стрим не буферизуем ни на каком уровне.
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Таймауты раздельные, как и в самом гейтвее (§3.3.8):
            # один общий либо режет длинные ответы, либо не ловит
            # зависший префилл.
            proxy_connect_timeout 5s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Повтор только на ошибках соединения. Ретрай после начала
            # ответа породил бы дубли в уже начатом стриме.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
