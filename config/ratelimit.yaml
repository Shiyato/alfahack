# Квотирование (§3.3.3.5). Семантика — первое совпавшее правило, как в ACL.
# ВНИМАНИЕ: порядок является частью семантики. Специфичные правила ставятся
# выше общих; валидатор предупредит о недостижимых.
#
# Квоты режутся по токенам, а не только по запросам: запрос с контекстом на
# 100k токенов и запрос на 200 нагружают систему на два порядка по-разному.
# Пара «токены + запросы» нужна одновременно — токены ловят тяжёлые запросы,
# счёт запросов ловит шквал лёгких.
#
# Алгоритм окна — token bucket: агентская нагрузка принципиально всплесковая,
# агент выпускает серию запросов подряд по мере обхода инструментов, и
# fixed window резал бы легитимные серии.
#
# ОТКУДА ЧИСЛА. Их нельзя брать «на глаз»: для LLM-трафика интуиция
# промахивается на два порядка. Средняя длина запроса агентской трассы —
# 8596 входных плюс 182 выходных токена (§5.1), то есть ~8800 на запрос.
# Значит, солидно выглядящая квота в 500 000 токенов/минуту даёт всего
# 0,9 запроса в секунду. Первая версия этого файла была выставлена именно
# так, и под нагрузочным профилем гейтвей отдавал 429 не из-за перегрузки,
# а из-за собственных квот — то есть измерял не то, что нужно.
#
# Правило: сначала назначается целевая интенсивность в запросах в секунду,
# затем она умножается на среднюю длину запроса и на 60.
#   квота_токенов_в_минуту = целевые_rps × средняя_длина_запроса × 60

rules:
  - id: agent-main-generous
    when:
      subjects: ["team:engineering"]
      models: ["main"]
    # 200 запросов/с × 8800 токенов × 60
    tokens_per_minute: 105000000
    requests_per_minute: 12000
    max_concurrent: 512
    burst_multiplier: 3.0

  - id: interactive-protected
    when:
      service_classes: ["interactive"]
    # 150 запросов/с × 8800 токенов × 60.
    #
    # Квота у защищаемого класса должна быть НЕ МЕНЬШЕ, чем у батча по
    # интенсивности. Это неочевидно и проверено замером: при квоте в
    # 50 запросов/с интерактивный класс упирался в собственный лимит
    # раньше, чем в ёмкость системы, и под перегрузкой получал ХУЖЕ
    # батча — приоритетная очередь просто не успевала ничего защитить.
    #
    # Разделение обязанностей: квота защищает от злоупотребления,
    # приоритетная очередь — от конкуренции за ёмкость (§2.2). Если
    # квота срабатывает первой, второй механизм выключен.
    tokens_per_minute: 80000000
    requests_per_minute: 9000
    max_concurrent: 128
    burst_multiplier: 2.0

  - id: batch-throttled
    when:
      service_classes: ["batch"]
    # 400 запросов/с × 8800 токенов × 60. Батчу дают много токенов, но
    # мало одновременности: он должен растягиваться по времени, а не
    # занимать все слоты (§2.2).
    tokens_per_minute: 210000000
    requests_per_minute: 24000
    max_concurrent: 64
    burst_multiplier: 1.2

  - id: default-catch-all
    when: {}
    # Неизвестному потребителю — 10 запросов/с.
    tokens_per_minute: 5300000
    requests_per_minute: 600
    max_concurrent: 32
