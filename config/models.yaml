# Реестр моделей и апстримов (§3.3.7). Правится на ходу: hot-reload подхватит
# изменение без передеплоя — это демо критерия «гибкость» (§1.2).
#
# Адреса подставляются из окружения: один и тот же файл работает локально
# (по умолчанию — localhost) и в контейнере, где апстримы доступны под
# именами сервисов. Две копии конфига неизбежно разъехались бы.

upstreams:
  - id: mock-a
    base_url: ${MOCK_A_URL:-http://127.0.0.1:9001}
    model: mock-llm
    adapter: openai
    # state_url отдаёт pending_prefill_tokens и признак очереди. Доступен
    # только у self-hosted движка — сценарий 1 из §3.3.6.8. Если апстрим
    # непрозрачен, строку убираем, и роутер деградирует до наблюдаемых
    # сигналов, не ломаясь.
    state_url: ${MOCK_A_URL:-http://127.0.0.1:9001}/state
    timeout_connect_s: 5.0
    # Таймауты раздельные. Один общий — типичная ошибка: он либо режет
    # длинные легитимные ответы, либо не ловит зависший префилл (§3.3.8).
    timeout_ttft_s: 30.0
    timeout_total_s: 600.0

  - id: mock-b
    base_url: ${MOCK_B_URL:-http://127.0.0.1:9002}
    model: mock-llm
    adapter: openai
    state_url: ${MOCK_B_URL:-http://127.0.0.1:9002}/state

  - id: mock-c
    base_url: ${MOCK_C_URL:-http://127.0.0.1:9003}
    model: mock-llm
    adapter: openai
    state_url: ${MOCK_C_URL:-http://127.0.0.1:9003}/state

  - id: mock-slow
    base_url: ${MOCK_SLOW_URL:-http://127.0.0.1:9004}
    model: mock-llm
    adapter: openai
    state_url: ${MOCK_SLOW_URL:-http://127.0.0.1:9004}/state

# Логическое имя модели → апстримы, которые её обслуживают.
models:
  main: [mock-a, mock-b, mock-c]
  reserve: [mock-slow]

# Целевые показатели (§2.1.4). TTFT-SLO линейный по длине входа:
# запрос на 100k токенов физически не ответит так же быстро, как на 500.
# Коэффициенты — из калибровочного прогона, не из головы.
slo:
  ttft_base_ms: 500.0
  ttft_per_token_ms: 0.05
  tpot_ms: 30.0
  relative_ttft_multiplier: 10.0
  relative_tpot_multiplier: 5.0

router:
  # least_load | consistent_hash | session | dualmap — см. §3.3.6.3c.
  # session выбран основным: он требует только номера хода, который
  # извлекается из тела запроса, и потому работает при непрозрачном апстриме.
  strategy: session
  block_tokens: 256
  prefix_ttl_s: 600.0
  # Плато гиперпараметров SMetric широкое: TPS меняется в пределах 6%
  # при OVERLOAD от 1 до бесконечности. Подбирать не нужно.
  overload_factor: 2.0
  hit_ratio_factor: 0.5

# Устойчивость (§3.3.8). Вынесено в конфигурацию, потому что поведение
# незнакомой платформы при отказах заранее неизвестно: её таймауты, коды
# ошибок и скорость восстановления выясняются на месте, и крутить их
# придётся правкой YAML, а не передеплоем.
resilience:
  # Размыкатель
  error_rate_threshold: 0.5
  min_samples: 20
  consecutive_failures_to_open: 3   # серия отказов — сигнал сильнее доли в окне
  latency_multiplier: 5.0           # ответ во столько раз хуже бюджета = отказ
  open_duration_s: 10.0
  half_open_successes: 3
  window_s: 30.0
  # Ретраи. Ограничение «только до первого отданного токена» жёсткое и
  # конфигом не снимается: после него стрим не идемпотентен.
  max_attempts: 2
  # Селективная отдача
  queue_max_wait_s: 30.0
  queue_poll_interval_s: 0.002
  # Опрос состояния апстримов. По замеру Б-2 устаревание сигнала рушит
  # admission control сильнее, чем отсутствие любых демпферов: доля
  # запросов в SLO падала со 100% до 10%. Это несущий параметр.
  probe_interval_s: 0.25
  probe_timeout_s: 1.0
  fairshare_window_s: 10.0

admission:
  max_queue_depth: 1000
  # Демпферы контура раннего отклонения (§3.3.3.3). Без них — автоколебания.
  ewma_alpha: 0.2
  reject_threshold: 1.0
  resume_threshold: 0.8
  default_output_estimate: 512
