# Правила деградации (§3.3.8). Первое совпавшее.
#
# Две тонкости, из-за которых этот файл выглядит скромнее вендорских примеров:
#
# 1. Переопределение параметров при подмене модели здесь не поддерживается.
#    Технически это удобно, но семантически означает, что клиент молча
#    получает ответ на другой запрос. Для банковского контура так нельзя
#    без явной пометки о деградации — её проставляет stream pipeline.
#
# 2. 429 как триггер конфликтует с нашим admission control: перекладывая
#    нагрузку на соседа, мы переносим перегрузку, а не лечим её. Поэтому
#    цель обязана иметь независимый пул ёмкости, и это подтверждается
#    явным флагом, который проверяет валидатор.

rules:
  - id: main-to-reserve
    when:
      models: ["main"]
      response_status_codes: [500, 502, 503, 504]
    fallback_models:
      - target: reserve

  - id: main-overload-to-reserve
    when:
      models: ["main"]
      response_status_codes: [429]
    fallback_models:
      - target: reserve
    # Подтверждаем осознанно: reserve обслуживается отдельным пулом,
    # поэтому переброс по 429 не создаёт каскад.
    independent_capacity: true
